name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Remind README sync
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^app/" && ! git diff --name-only HEAD~1 HEAD | grep -q "README.md"; then
            echo "::warning::本次提交改了 app/ 但没有更新 README.md，请保持进度清单与架构说明同步"
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/lvyoubao-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "KEYSTORE_FILE=$KS"
              echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "使用正式签名"
          else
            echo "KEYSTORE_FILE=" >> "$GITHUB_ENV"
            echo "未配置签名密钥，回退 debug 签名"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseCompileClasspath --no-daemon > deps.txt || true
          grep -E "androidx.compose.ui:ui-android|mapsforge" deps.txt | head -5
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK and tag
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          # 标签与应用内版本号严格一致（v0.7.0），不再拼构建号——
          # 此前 vX.Y.Z-bN 的标签和应用内 vX.Y.Z(版本号) 两套数字对不上，更新检查会误判"已是最新"
          TAG="v${VERSION}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lvyoubao-${VERSION}.apk"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同版本号重复发版时，先删旧 Release 和旧标签再建，保证 Release 始终对应最新 main
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # 更新说明按 commit 内容生成：上一个 Release 的 tag 到本次构建之间的提交
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' || true)
          COMMITS=""
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" 2>/dev/null | grep -v "\[skip ci\]" || true)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log -8 --pretty=format:"- %s" | grep -v "\[skip ci\]" || true)
          fi
          NOTES=$(cat <<EOF
          ## 本次更新

          ${COMMITS}

          ## 安装说明

          - 下载 APK 安装（需允许安装未知来源应用）
          - 首次启动进入「设置」，选择服务商（默认 DeepSeek）并填入 API Key
          EOF
          )
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "旅游宝 v${VERSION}" \
            --notes "$NOTES" \
            --latest
