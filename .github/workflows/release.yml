name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/lvyoubao-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "KEYSTORE_FILE=$KS"
              echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "使用正式签名"
          else
            echo "KEYSTORE_FILE=" >> "$GITHUB_ENV"
            echo "未配置签名密钥，回退 debug 签名"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK and tag
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lvyoubao-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "旅游宝 v${VERSION}（build ${GITHUB_RUN_NUMBER}）" \
            --notes "自动构建于 commit ${GITHUB_SHA::7}

          - 下载 APK 安装（需允许安装未知来源应用）
          - 首次启动进入「设置」，选择服务商（默认 DeepSeek）并填入 API Key
          - 变更记录：https://github.com/${GITHUB_REPOSITORY}/commits/main" \
            --latest
